name: build-windows-exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 mss pillow pytesseract deep-translator keyboard pyinstaller

    - name: Install Tesseract
      shell: pwsh
      run: |
        choco install tesseract -y --no-progress

        $paths = @(
          "C:\Program Files\Tesseract-OCR\tesseract.exe",
          "C:\Program Files (x86)\Tesseract-OCR\tesseract.exe"
        )

        foreach ($p in $paths) {
          if (Test-Path $p) {
            echo "找到Tesseract: $p"
            echo "TESSERACT_PATH=$p" >> $env:GITHUB_ENV
            break
          }
        }

        tesseract --version


    - name: Build exe
      shell: pwsh
      run: |

        pyinstaller `
          --noconfirm `
          --clean `
          --onefile `
          --windowed `
          --name ScreenTranslateSnipper `
          screen_translate_snipper.py


    - name: Upload exe
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslateSnipper
        path: dist/ScreenTranslateSnipper.exe
