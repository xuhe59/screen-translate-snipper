name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress

      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 mss pillow pytesseract deep-translator keyboard pyinstaller

      - name: Bundle Tesseract files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Get-Command tesseract).Source
          $dir = Split-Path $exe -Parent

          New-Item -ItemType Directory -Force -Path bundle\tesseract | Out-Null
          Copy-Item "$dir\*" bundle\tesseract -Recurse -Force

          # 如果仓库里放了中文语言包，就一起带上
          # 推荐路径：assets/tessdata/chi_sim.traineddata
          if (Test-Path "assets\tessdata") {
            New-Item -ItemType Directory -Force -Path bundle\tesseract\tessdata | Out-Null
            Copy-Item "assets\tessdata\*" bundle\tesseract\tessdata -Recurse -Force
          }

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name ScreenTranslateSnipper `
            --add-data "bundle\tesseract;tesseract" `
            screen_translate_snipper.py

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\ScreenTranslateSnipper.exe `
            -DestinationPath release\ScreenTranslateSnipper-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslateSnipper-win64
          path: release/ScreenTranslateSnipper-win64.zip
