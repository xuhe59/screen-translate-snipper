name: Build Screen Translate Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安装 Python 依赖
      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6  pillow pytesseract deep-translator keyboard pyinstaller

      # 4. 安装 Tesseract OCR
      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress

          $paths = @(
            "C:\Program Files\Tesseract-OCR\tesseract.exe",
            "C:\Program Files (x86)\Tesseract-OCR\tesseract.exe"
          )

          $found = $null
          foreach ($p in $paths) {
            if (Test-Path $p) {
              $found = $p
              break
            }
          }

          if (-not $found) {
            throw "没有找到 Tesseract"
          }

          Write-Host "找到 Tesseract: $found"

          # 关键修复：GITHUB_ENV 只在“下一个 step”生效，
          # 当前 step 要用，必须同时给 $env: 赋值
          $env:TESSERACT_PATH = $found
          Add-Content -Path $env:GITHUB_ENV -Value "TESSERACT_PATH=$found" -Encoding utf8

          & $found --version

      # 5. 准备要打进 exe 里的 Tesseract 文件（可执行文件 + DLL + 语言包）
      - name: Prepare bundled Tesseract files
        shell: pwsh
        run: |
          $tessDir = Split-Path $env:TESSERACT_PATH -Parent
          $bundleDir = "tesseract_bin"

          New-Item -ItemType Directory -Force -Path "$bundleDir\tessdata" | Out-Null

          # 复制 tesseract.exe 本体和它依赖的所有 dll
          Copy-Item "$tessDir\tesseract.exe" -Destination $bundleDir
          Copy-Item "$tessDir\*.dll" -Destination $bundleDir -ErrorAction SilentlyContinue

          # 英文语言包：choco 安装通常自带，没有的话就下载
          if (Test-Path "$tessDir\tessdata\eng.traineddata") {
            Copy-Item "$tessDir\tessdata\eng.traineddata" -Destination "$bundleDir\tessdata"
          } else {
            Invoke-WebRequest `
              -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata" `
              -OutFile "$bundleDir\tessdata\eng.traineddata"
          }

          # 中文简体语言包：单独下载
          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/chi_sim.traineddata" `
            -OutFile "$bundleDir\tessdata\chi_sim.traineddata"

          Write-Host "打包目录内容："
          Get-ChildItem $bundleDir -Recurse | Select-Object FullName

      # 6. 打包exe（把 tesseract.exe / DLL / 语言包都塞进单文件 exe）
      - name: Build EXE
        shell: pwsh
        run: |
          $addBinaryArgs = @()

          Get-ChildItem -Path "tesseract_bin" -Filter "*.exe" | ForEach-Object {
            $addBinaryArgs += "--add-binary"
            $addBinaryArgs += "$($_.FullName);."
          }

          Get-ChildItem -Path "tesseract_bin" -Filter "*.dll" | ForEach-Object {
            $addBinaryArgs += "--add-binary"
            $addBinaryArgs += "$($_.FullName);."
          }

          pyinstaller --noconfirm --clean --onefile --windowed --name ScreenTranslateSnipper `
            @addBinaryArgs `
            --add-data "tesseract_bin\tessdata;tessdata" `
            screen_translate_snipper.py

      # 7. 上传生成文件
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslateSnipper-Windows
          path: dist/ScreenTranslateSnipper.exe
